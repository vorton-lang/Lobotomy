[package]
name = "lobotomy-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The library API is not stable; the version is pinned and its types stay inside this crate
# (harness-adapter.md §6).
jj-lib = { version = "=0.45.1", default-features = false, features = ["git"] }
# Only for the object hash kind that jj-lib's git backend takes; the version follows jj-lib's.
gix = { version = "0.87.1", default-features = false, features = ["sha1"] }
futures = "0.3"
pollster = "1"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
