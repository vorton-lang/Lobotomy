[package]
name = "lobotomy-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lobotomy-core.workspace = true
lobotomy-harness.workspace = true
lobotomy-agent.workspace = true
lobotomy-worker-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }

[dev-dependencies]
# The fake forge in tests/forge.rs.
axum = { workspace = true, features = ["json"] }
tempfile.workspace = true
