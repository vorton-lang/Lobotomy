[workspace]
resolver = "3"
members = ["crates/core", "crates/harness", "crates/lobotomyd"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
lobotomy-core = { path = "crates/core" }
lobotomy-harness = { path = "crates/harness" }
anyhow = "1"
libc = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
