[workspace]
resolver = "3"
members = ["crates/core", "crates/lobotomyd"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
lobotomy-core = { path = "crates/core" }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
